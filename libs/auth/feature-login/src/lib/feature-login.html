<div class="min-h-screen flex items-center justify-center bg-surface-50 dark:bg-surface-900 px-4">
  <div class="w-full max-w-md">
    <!-- Logo/Header -->
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <img src="logo.svg" alt="FIAP FARM" class="h-20" />
      </div>
      <p class="text-surface-600 dark:text-surface-400">
        Gerencie sua fazenda com facilidade
      </p>
    </div>

    <!-- Login Card -->
    <lib-card title="Entrar" subtitle="Digite suas credenciais para acessar sua conta">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Error Message -->
        @if (authFacade.error()) {
          <p-message
            severity="error"
            [text]="authFacade.error()!"
            styleClass="mb-4 w-full"
          />
        }

        <!-- Email Field -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-2">
            E-mail
          </label>
          <input
            pInputText
            id="email"
            formControlName="email"
            type="email"
            placeholder="seu@email.com"
            class="w-full"
            [class.ng-invalid]="hasError('email')"
            [class.ng-dirty]="hasError('email')"
            data-testid="email-input"
          />
          @if (hasError('email')) {
            <small class="text-red-500 mt-1 block" data-testid="email-error">
              {{ getErrorMessage('email') }}
            </small>
          }
        </div>

        <!-- Password Field -->
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-surface-700 dark:text-surface-300 mb-2">
            Senha
          </label>
          <p-password
            formControlName="password"
            inputId="password"
            placeholder="Digite sua senha"
            [toggleMask]="true"
            [feedback]="false"
            styleClass="w-full"
            inputStyleClass="w-full"
            [class.ng-invalid]="hasError('password')"
            [class.ng-dirty]="hasError('password')"
            data-testid="password-input"
          />
          @if (hasError('password')) {
            <small class="text-red-500 mt-1 block" data-testid="password-error">
              {{ getErrorMessage('password') }}
            </small>
          }
        </div>

        <!-- Submit Button -->
        <p-button
          type="submit"
          label="Entrar"
          icon="pi pi-sign-in"
          styleClass="w-full"
          [loading]="authFacade.isLoading()"
          [disabled]="authFacade.isLoading()"
          data-testid="submit-button"
        />

        <!-- Divider -->
        <div class="my-6 flex items-center">
          <div class="flex-1 border-t border-surface-300 dark:border-surface-600"></div>
          <span class="px-4 text-sm text-surface-500 dark:text-surface-400">ou</span>
          <div class="flex-1 border-t border-surface-300 dark:border-surface-600"></div>
        </div>

        <!-- Register Link -->
        <div class="text-center">
          <p class="text-sm text-surface-600 dark:text-surface-400">
            Não tem uma conta?
            <button
              type="button"
              (click)="onRegisterClick()"
              class="text-primary-600 dark:text-primary-400 hover:underline font-medium ml-1"
              data-testid="register-link"
            >
              Cadastre-se
            </button>
          </p>
        </div>
      </form>
    </lib-card>
  </div>
</div>
