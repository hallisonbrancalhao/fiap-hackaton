<p-menubar [model]="items()">
  <ng-template #start>
    <a routerLink="/" class="flex align-items-center gap-2">
      <img src="logo.svg" alt="FIAP FARM" class="mr-2 h-20" />
    </a>
  </ng-template>
  <ng-template #end>
    <div class="flex items-center gap-3">
      <span class="text-sm font-medium">{{ userName() }}</span>
      <p-button
        type="button"
        label="Sair"
        [outlined]="true"
        icon="pi pi-sign-out"
        severity="secondary"
        (onClick)="onLogout()"
        data-testid="logout-button"
      />
    </div>
  </ng-template>
</p-menubar>
